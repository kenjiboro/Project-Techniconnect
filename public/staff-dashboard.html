<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Dashboard &mdash; TechniConnect</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  .dup-badge {
    display: inline-flex; align-items: center; gap: 0.3rem;
    background: #fef3c7; color: #92400e; border: 1px solid #fcd34d;
    border-radius: 999px; padding: 0.15rem 0.6rem;
    font-size: 0.72rem; font-weight: 700; text-transform: uppercase;
    cursor: pointer;
  }
  .dup-badge:hover { background: #fde68a; }

  .dup-panel {
    background: #fffbeb; border: 1px solid #fcd34d;
    border-radius: var(--radius); padding: 0.75rem 1rem;
    margin-top: 0.5rem; font-size: 0.85rem;
  }
  .dup-panel .dup-title { font-weight: 700; color: #92400e; margin-bottom: 0.4rem; }
  .dup-match {
    padding: 0.4rem 0; border-bottom: 1px solid #fde68a; color: var(--text);
  }
  .dup-match:last-child { border-bottom: none; }

  .ann-row {
    display: flex; align-items: flex-start; justify-content: space-between;
    padding: 0.75rem 0; border-bottom: 1px solid var(--border); gap: 1rem;
  }
  .ann-row:last-child { border-bottom: none; }
  .ann-row-body { flex: 1; }
  .ann-row-title { font-weight: 700; color: var(--primary); margin-bottom: 0.2rem; }
  .ann-row-content { font-size: 0.87rem; color: var(--text); margin-bottom: 0.3rem; }
  .ann-row-meta { font-size: 0.78rem; color: var(--muted); }
  .ann-row-actions { display: flex; gap: 0.4rem; flex-shrink: 0; }
</style>
</head>
<body>
<nav class="navbar">
  <div class="navbar-brand">TechniConnect</div>
  <div class="navbar-links">
    <span style="color:#fff;" class="small">Staff Account</span>
    <a href="/logout" class="button ghost btn-small">Log Out</a>
  </div>
</nav>
<div class="container">
  <h1 class="page-title">Alumni Affairs Dashboard</h1>

  <!-- Verification Queue -->
  <section class="card">
    <h2 class="section-title">Verification Queue</h2>
    <div id="queueControls" style="margin-bottom:0.75rem;display:flex;gap:0.75rem;align-items:center;">
      <input type="text" id="qSearch" placeholder="Search by name, email, or student ID"
        style="padding:0.55rem 0.75rem;border:1px solid var(--border);border-radius:var(--radius);width:320px;">
      <button class="button primary btn-small" onclick="loadQueue()">Refresh</button>
    </div>
    <div id="queue" class="empty">Loading...</div>
  </section>

  <!-- Announcements Management -->
  <section class="card">
    <h2 class="section-title">Announcements</h2>

    <!-- Post new announcement -->
    <form id="announcementForm" style="margin-bottom:1.25rem;">
      <div class="form-group">
        <label for="ann-title">Title <span class="require">*</span></label>
        <input type="text" id="ann-title" placeholder="Announcement title" required>
      </div>
      <div class="form-group">
        <label for="ann-content">Content <span class="require">*</span></label>
        <textarea id="ann-content" rows="3" placeholder="Write announcement content..." required></textarea>
      </div>
      <button type="submit" class="button primary btn-small" id="annBtn">Post Announcement</button>
    </form>

    <div id="announcementList"><div class="empty">Loading announcements...</div></div>
  </section>

  <!-- Alumni Records -->
  <section class="card">
    <h2 class="section-title">Alumni Records (staff only)</h2>
    <div style="margin-bottom:0.75rem;display:flex;gap:0.75rem;align-items:center;">
      <input type="text" id="rSearch" placeholder="Search alumni records..."
        style="padding:0.55rem 0.75rem;border:1px solid var(--border);border-radius:var(--radius);width:320px;">
      <button class="button secondary btn-small" onclick="loadRecords()">Search</button>
    </div>
    <div id="records" class="empty">Loading...</div>
  </section>
</div>

<!-- Record edit modal -->
<div id="modal" class="hidden"
  style="position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:50;display:flex;align-items:center;justify-content:center;">
  <div class="card" style="max-width:560px;width:92%;background:var(--surface);position:relative;">
    <button onclick="closeModal()"
      style="position:absolute;top:1rem;right:1rem;background:none;border:none;font-size:1.5rem;color:var(--muted);">&times;</button>
    <h2 class="section-title" style="margin-top:0;">Edit Alumni Record</h2>
    <form id="editForm">
      <input type="hidden" name="id">
      <div class="grid-2">
        <div class="form-group"><label>First name</label><input name="first_name" required></div>
        <div class="form-group"><label>Middle name</label><input name="middle_name"></div>
      </div>
      <div class="form-group"><label>Last name</label><input name="last_name" required></div>
      <div class="grid-2">
        <div class="form-group"><label>Batch year</label><input name="batch_year" type="number"></div>
        <div class="form-group"><label>College</label><input name="college"></div>
      </div>
      <div class="grid-2">
        <div class="form-group"><label>Email</label><input name="email"></div>
        <div class="form-group"><label>Contact number</label><input name="contact_number"></div>
      </div>
      <div class="form-group"><label>Address</label><textarea name="address" rows="3"></textarea></div>
      <div style="display:flex;gap:0.75rem;margin-top:1rem;">
        <button type="submit" class="button primary">Save</button>
        <button type="button" class="button ghost" onclick="closeModal()">Cancel</button>
      </div>
    </form>
  </div>
</div>

<script>
const modal = document.getElementById('modal');
const editForm = document.getElementById('editForm');
let editingId = null;

function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[c]));
}

async function loadJson(path) {
  const res = await fetch(path);
  if (!res.ok) throw new Error('Failed to load ' + path);
  return res.json();
}

// --- Verification queue ---
async function loadQueue() {
  const el = document.getElementById('queue');
  el.innerHTML = '<div class="empty">Loading...</div>';
  try {
    const rows = await loadJson('/staff/verification-queue');
    if (!rows.length) {
      el.innerHTML = '<div class="empty">No pending registration requests.</div>';
      return;
    }

    // Fetch duplicate checks for all pending rows in parallel
    const dupResults = await Promise.all(
      rows.map(r =>
        fetch(`/staff/duplicate-check/${r.user_id}`)
          .then(res => res.ok ? res.json() : { duplicates: [] })
          .catch(() => ({ duplicates: [] }))
      )
    );

    el.innerHTML = `
      <table>
        <thead>
          <tr>
            <th>Name</th><th>Email</th><th>Status</th>
            <th>Submitted</th><th>ID Document</th><th>Action</th>
          </tr>
        </thead>
        <tbody>
          ${rows.map((r, i) => {
            const dups = dupResults[i].duplicates || [];
            const hasDup = dups.length > 0;
            const dupId = 'dup-' + r.id;
            return `
              <tr>
                <td>
                  <div>${escapeHtml(r.first_name || '')} ${escapeHtml(r.last_name || '')}</div>
                  ${hasDup ? `
                    <span class="dup-badge" onclick="toggleDupPanel('${dupId}')">
                      ⚠ ${dups.length} possible duplicate${dups.length > 1 ? 's' : ''}
                    </span>
                    <div id="${dupId}" class="dup-panel" style="display:none;">
                      <div class="dup-title">Matching verified alumni records:</div>
                      ${dups.map(d => `
                        <div class="dup-match">
                          <strong>${escapeHtml(d.first_name || '')} ${escapeHtml(d.last_name || '')}</strong>
                          &mdash; ${escapeHtml(d.email || '—')}
                          ${d.batch_year ? ' &middot; Batch ' + d.batch_year : ''}
                          ${d.college ? ' &middot; ' + escapeHtml(d.college) : ''}
                        </div>
                      `).join('')}
                    </div>
                  ` : ''}
                </td>
                <td>${escapeHtml(r.users?.email || r.email || '—')}</td>
                <td><span class="badge ${r.status}">${r.status}</span></td>
                <td class="small">${new Date(r.created_at).toLocaleDateString()}</td>
                <td>
                  ${r.id_document_path
                    ? `<a href="${escapeHtml(r.id_document_path)}" class="small" target="_blank" rel="noopener">View ID</a>`
                    : '<span class="small">—</span>'}
                </td>
                <td>
                  <button class="button success btn-small" onclick="handleRequest(${r.id},'approve')">Approve</button>
                  <button class="button danger btn-small" onclick="handleRequest(${r.id},'reject')">Reject</button>
                </td>
              </tr>
            `;
          }).join('')}
        </tbody>
      </table>
    `;
  } catch (e) {
    el.innerHTML = '<div class="empty">Unable to load queue.</div>';
  }
}

function toggleDupPanel(id) {
  const panel = document.getElementById(id);
  if (!panel) return;
  panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
}

async function handleRequest(id, action) {
  const notes = action === 'reject' ? prompt('Reason for rejection (optional):') : '';
  if (action === 'reject' && notes === null) return;
  try {
    const res = await fetch(`/staff/verification-queue/${id}/action`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action, admin_notes: notes })
    });
    if (!res.ok) throw new Error(await res.text());
    loadQueue();
  } catch (e) { alert(e.message || 'Action failed.'); }
}

// --- Alumni records ---
async function loadRecords() {
  const q = document.getElementById('rSearch').value;
  try {
    const rows = await loadJson('/staff/alumni-records?q=' + encodeURIComponent(q));
    const el = document.getElementById('records');
    if (!rows.length) {
      el.innerHTML = '<div class="empty">No alumni records found.</div>';
      return;
    }
    el.innerHTML = `
      <table>
        <thead>
          <tr><th>Name</th><th>Student ID</th><th>Email</th><th>Batch</th><th>College</th><th>Verified</th><th>In Directory</th><th>Action</th></tr>
        </thead>
        <tbody>
          ${rows.map(r => `
            <tr>
              <td>${escapeHtml(r.first_name || '')} ${escapeHtml(r.last_name || '')}</td>
              <td>${escapeHtml(r.student_id || '—')}</td>
              <td>${escapeHtml(r.email || '—')}</td>
              <td>${r.batch_year || '—'}</td>
              <td>${escapeHtml(r.college || '—')}</td>
              <td>${r.is_verified ? '<span class="badge approved">Yes</span>' : '<span class="badge pending">No</span>'}</td>
              <td>${r.show_in_directory ? '✓' : '—'}</td>
              <td>
                <button class="button ghost btn-small" onclick="openEdit(
                  ${r.id},
                  '${escapeHtml(r.first_name||'')}','${escapeHtml(r.middle_name||'')}',
                  '${escapeHtml(r.last_name||'')}',${r.batch_year||'null'},
                  '${escapeHtml(r.college||'')}','${escapeHtml(r.email||'')}',
                  '${escapeHtml(r.contact_number||'')}','${escapeHtml(r.address||'')}'
                )">Edit</button>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
  } catch (e) {
    document.getElementById('records').innerHTML = '<div class="empty">Unable to load records.</div>';
  }
}

// --- Edit modal ---
function openEdit(id, fn, mn, ln, by, col, em, cn, addr) {
  editingId = id;
  const f = editForm;
  f.elements['id'].value = id;
  f.elements['first_name'].value = fn;
  f.elements['middle_name'].value = mn;
  f.elements['last_name'].value = ln;
  f.elements['batch_year'].value = by || '';
  f.elements['college'].value = col;
  f.elements['email'].value = em;
  f.elements['contact_number'].value = cn;
  f.elements['address'].value = addr;
  modal.classList.remove('hidden');
}

function closeModal() { modal.classList.add('hidden'); }

editForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = e.target.querySelector('button[type="submit"]');
  btn.disabled = true;
  btn.textContent = 'Saving...';
  const body = Object.fromEntries(new FormData(e.target).entries());
  try {
    const res = await fetch(`/staff/alumni-records/${editingId}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
    });
    if (!res.ok) throw new Error(await res.text());
    closeModal();
    loadRecords();
  } catch (err) {
    alert(err.message || 'Update failed.');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Save';
  }
});

// --- Announcements ---
async function loadAnnouncements() {
  const el = document.getElementById('announcementList');
  try {
    const rows = await loadJson('/staff/announcements');
    if (!rows.length) {
      el.innerHTML = '<div class="empty">No announcements yet.</div>';
      return;
    }
    el.innerHTML = rows.map(a => `
      <div class="ann-row">
        <div class="ann-row-body">
          <div class="ann-row-title">
            ${escapeHtml(a.title)}
            ${!a.published ? '<span class="badge pending" style="margin-left:0.4rem;">Unpublished</span>' : ''}
          </div>
          <div class="ann-row-content">${escapeHtml(a.content)}</div>
          <div class="ann-row-meta">${new Date(a.created_at).toLocaleDateString()}</div>
        </div>
        <div class="ann-row-actions">
          <button class="button ghost btn-small" onclick="togglePublish(${a.id}, ${a.published})">
            ${a.published ? 'Unpublish' : 'Publish'}
          </button>
          <button class="button danger btn-small" onclick="deleteAnnouncement(${a.id})">Delete</button>
        </div>
      </div>
    `).join('');
  } catch {
    el.innerHTML = '<div class="empty">Unable to load announcements.</div>';
  }
}

document.getElementById('announcementForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('annBtn');
  const title = document.getElementById('ann-title').value.trim();
  const content = document.getElementById('ann-content').value.trim();
  if (!title || !content) return;
  btn.disabled = true;
  btn.textContent = 'Posting...';
  try {
    const res = await fetch('/staff/announcements', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title, content })
    });
    if (!res.ok) throw new Error(await res.text());
    document.getElementById('ann-title').value = '';
    document.getElementById('ann-content').value = '';
    loadAnnouncements();
  } catch (err) {
    alert(err.message || 'Failed to post announcement.');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Post Announcement';
  }
});

async function togglePublish(id, currentlyPublished) {
  try {
    const res = await fetch(`/staff/announcements/${id}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ published: !currentlyPublished })
    });
    if (!res.ok) throw new Error(await res.text());
    loadAnnouncements();
  } catch (err) { alert(err.message || 'Failed to update.'); }
}

async function deleteAnnouncement(id) {
  if (!confirm('Delete this announcement? This cannot be undone.')) return;
  try {
    const res = await fetch(`/staff/announcements/${id}`, { method: 'DELETE' });
    if (!res.ok) throw new Error(await res.text());
    loadAnnouncements();
  } catch (err) { alert(err.message || 'Failed to delete.'); }
}

// Initial load
loadQueue();
loadRecords();
loadAnnouncements();
</script>
</body>
</html>
