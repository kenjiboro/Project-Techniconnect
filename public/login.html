<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In &mdash; TechniConnect</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="navbar">
  <div class="navbar-brand">TechniConnect</div>
  <div class="navbar-links">
    <a href="/">Back to home</a>
  </div>
</nav>
<div class="container">
  <div class="card" style="max-width:460px;margin:2rem auto;">
    <h1 class="page-title" style="text-align:center;">Log In</h1>
    <div class="flash error hidden" id="error"></div>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label>Email address</label>
        <input type="email" name="email" required placeholder="you@cit.edu" autocomplete="email">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" required autocomplete="current-password">
      </div>
      <div class="form-group" style="display:flex;justify-content:space-between;align-items:center;">
        <label class="small" style="margin:0;">Role:</label>
        <select name="role" style="width:auto;padding:0.55rem 0.75rem;">
          <option value="alumni">Alumnus / Alumna</option>
          <option value="staff">Alumni Affairs Staff</option>
        </select>
      </div>
      <button type="submit" class="button primary" style="width:100%;" id="loginBtn">Log In</button>
    </form>
    <p class="small" style="text-align:center;margin-top:1rem;">
      Default staff account: <code>staff@cit.edu</code> / <code>admin123</code>
    </p>
  </div>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const error = document.getElementById('error');
  error.classList.add('hidden');
  error.textContent = '';
  btn.disabled = true;
  btn.textContent = 'Signing in...';
  const fd = new FormData(e.target);
  const body = Object.fromEntries(fd.entries());
  try {
    const res = await fetch('/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if (!res.ok) throw new Error(await res.text());
    window.location.href = body.role === 'staff' ? '/staff/dashboard' : '/alumni/dashboard';
  } catch (err) {
    error.textContent = err.message || 'Login failed.';
    error.classList.remove('hidden');
    btn.disabled = false;
    btn.textContent = 'Log In';
  }
});
</script>
</body>
</html>
